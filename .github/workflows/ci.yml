name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} — lint + unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint every PHP file
        run: bash tests/lint/lint.sh

      - name: Unit tests (no coverage)
        run: vendor/bin/phpunit --no-coverage

  static-analysis:
    name: PHPStan (level 5) + PHPCS hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: PHPCS
        run: vendor/bin/phpcs

  integration:
    name: Integration (WordPress container)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker compose -p cosmic -f tests/container/docker-compose.yml build
        env:
          COSMIC_MOUNT_OPTS: ""

      - name: Start stack
        run: docker compose -p cosmic -f tests/container/docker-compose.yml up -d
        env:
          COSMIC_MOUNT_OPTS: ""

      - name: Wait for WordPress
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:18080/; then exit 0; fi
            sleep 2
          done
          echo "WordPress did not come up" && exit 1

      - name: Bootstrap site
        run: |
          bash tests/integration/bootstrap.sh cosmic-wordpress-1
        env:
          COSMIC_CTR: docker

      - name: Smoke test
        run: |
          bash tests/integration/smoke.sh cosmic-wordpress-1
        env:
          COSMIC_CTR: docker
          COSMIC_MOUNT_OPTS: ""

      - name: Extended test
        run: |
          bash tests/integration/extended.sh cosmic-wordpress-1
        env:
          COSMIC_CTR: docker
          COSMIC_REDIS_CONTAINER: cosmic_redis_1

      - name: Deactivate test
        run: |
          bash tests/integration/deactivate.sh cosmic-wordpress-1
        env:
          COSMIC_CTR: docker

  package:
    name: Build release zip
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Build cosmic-cache.zip
        run: bash bin/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-cache-${GITHUB_REF_NAME}
          path: cosmic-cache.zip
